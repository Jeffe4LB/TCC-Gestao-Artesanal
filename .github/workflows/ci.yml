name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gestart
          POSTGRES_PASSWORD: gestart
          POSTGRES_DB: gestao_artesanal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestart -d gestao_artesanal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff

      - name: Ruff lint
        run: cd backend && ruff check .

      - name: Django tests
        env:
          DATABASE_URL: postgres://gestart:gestart@localhost:5432/gestao_artesanal
          SECRET_KEY: ci-secret-key-for-tests-only
          DEBUG: "False"
        run: cd backend && python manage.py test

      - name: Deploy check (settings_prod)
        env:
          DATABASE_URL: postgres://gestart:gestart@localhost:5432/gestao_artesanal
          SECRET_KEY: ci-secret-key-for-tests-only
          ALLOWED_HOSTS: example.com
          CORS_ALLOWED_ORIGINS: https://example.com
        run: |
          cd backend
          DJANGO_SETTINGS_MODULE=config.settings_prod python manage.py check --deploy

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: Build
        run: cd frontend && npm run build
